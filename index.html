<!DOCTYPE html>
<html lang="ja">
<head>    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スコアボード</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* カスタムスクロールバーのスタイル */
        .log-container::-webkit-scrollbar {
            width: 8px;
        }
        .log-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .log-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }
        .log-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>



<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-SJ6BHQHK73"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-SJ6BHQHK73');
</script>



    
</head>
<body class="bg-gray-100 p-4 flex flex-col items-center font-sans min-h-screen">

    <div class="bg-white p-6 rounded-3xl shadow-xl w-full max-w-4xl border border-gray-200 relative">
        <!-- バージョン情報 (左上) -->
        <div class="absolute top-4 left-6 text-sm font-semibold text-gray-500">
            Version:1.0
        </div>
        
        <!-- 製作者情報 (右上) -->
        <div class="absolute top-4 right-6 flex items-center space-x-2">
            <span class="text-sm font-semibold text-gray-500">製作者:</span>
            <a href="https://youtube.com/@ikumenrider?si=LXddF5sxgnGMxwHd" target="_blank" class="p-1 px-3 bg-gray-200 text-gray-700 rounded-lg text-sm font-bold transition-all duration-200 transform hover:scale-105 hover:bg-gray-300">
                育面ライダー
            </a>
        </div>

        <h1 class="text-4xl font-extrabold text-center text-gray-900 mb-2 mt-10 tracking-wide">
            スコアボード
        </h1>
        
        <!-- プレイヤー選択ボタン -->
        <div class="flex justify-center space-x-4 mb-8">
            <button id="btn-2p" class="p-3 rounded-xl shadow-lg transition-all duration-200 transform hover:scale-105 font-bold bg-blue-600 text-white">
                2人対戦
            </button>
            <button id="btn-3p" class="p-3 rounded-xl shadow-lg transition-all duration-200 transform hover:scale-105 font-bold bg-gray-200 text-gray-700 hover:bg-gray-300">
                3人対戦
            </button>
            <button id="btn-team" class="p-3 rounded-xl shadow-lg transition-all duration-200 transform hover:scale-105 font-bold bg-gray-200 text-gray-700 hover:bg-gray-300">
                チーム戦
            </button>
        </div>

        <!-- 得点ボード本体 -->
        <div id="scoreboard-container" class="grid grid-cols-2 gap-4 mb-8">
            <!-- プレイヤーカードがここに動的に挿入されます -->
        </div>

        <!-- スコアリセットボタン、元に戻すボタン、アプリ一覧ボタンを中央に配置 -->
        <div class="flex flex-col items-center space-y-4 mt-6">
            <div class="flex space-x-4">
                <button id="btn-undo" class="p-3 bg-gray-400 text-white rounded-xl shadow-lg hover:bg-gray-500 transition-all duration-200 transform hover:scale-105">
                    ↶ 元に戻す
                </button>
                <button id="btn-reset" class="p-3 bg-red-600 text-white rounded-xl shadow-lg hover:bg-red-700 transition-all duration-200 transform hover:scale-105">
                    スコアをリセット
                </button>
            </div>
            
            <!-- アプリ一覧ボタンを下に配置し、テキストカラーを黒に -->
            <a id="btn-app-list" href="https://ikumenrider.github.io/ikumenrider/" target="_blank" class="p-3 px-5 bg-green-300 text-gray-900 font-bold rounded-xl shadow-lg hover:bg-green-400 transition-all duration-200 transform hover:scale-105">
                アプリ一覧
            </a>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // グローバルな状態管理用の変数
            let mode = '2p'; // '2p', '3p', 'team'
            let scores = {
                player1: 0,
                player2: 0,
                player3: 0,
                team1: 0,
                team2: 0,
            };
            let logs = {
                player1: [],
                player2: [],
                player3: [],
                team1: [],
                team2: [],
            };
            let currentPlayers = {
                team1: '',
                team2: '',
            };
            let playersConfig = {
                '2p': [
                    { id: 'player1', name: 'プレイヤー1', color: 'bg-blue-200' },
                    { id: 'player2', name: 'プレイヤー2', color: 'bg-red-200' },
                ],
                '3p': [
                    { id: 'player1', name: 'プレイヤー1', color: 'bg-blue-200' },
                    { id: 'player2', name: 'プレイヤー2', color: 'bg-red-200' },
                    { id: 'player3', name: 'プレイヤー3', color: 'bg-yellow-200' },
                ],
                'team': [
                    { id: 'team1', name: 'チーム1', color: 'bg-blue-200' },
                    { id: 'team2', name: 'チーム2', color: 'bg-red-200' },
                ],
            };

            const scoreboardContainer = document.getElementById('scoreboard-container');
            const btn2p = document.getElementById('btn-2p');
            const btn3p = document.getElementById('btn-3p');
            const btnTeam = document.getElementById('btn-team');
            const btnUndo = document.getElementById('btn-undo');
            const btnReset = document.getElementById('btn-reset');

            // UIの初期描画
            renderScoreboard();

            // イベントリスナーの設定
            btn2p.addEventListener('click', () => setModeAndRender('2p', true));
            btn3p.addEventListener('click', () => setModeAndRender('3p', true));
            btnTeam.addEventListener('click', () => setModeAndRender('team', true));
            btnUndo.addEventListener('click', handleUndo);
            btnReset.addEventListener('click', handleResetScores);

            // モードを切り替えてUIを再描画する関数
            function setModeAndRender(newMode, resetScores = false) {
                mode = newMode;
                if (resetScores) {
                    handleResetScores();
                }
                
                // ボタンのスタイルを更新
                btn2p.classList.remove('bg-blue-600', 'text-white');
                btn3p.classList.remove('bg-blue-600', 'text-white');
                btnTeam.classList.remove('bg-blue-600', 'text-white');
                btn2p.classList.add('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
                btn3p.classList.add('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
                btnTeam.classList.add('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');

                if (mode === '2p') {
                    btn2p.classList.remove('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
                    btn2p.classList.add('bg-blue-600', 'text-white');
                } else if (mode === '3p') {
                    btn3p.classList.remove('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
                    btn3p.classList.add('bg-blue-600', 'text-white');
                } else if (mode === 'team') {
                    btnTeam.classList.remove('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300');
                    btnTeam.classList.add('bg-blue-600', 'text-white');
                }
                renderScoreboard();
            }

            // スコアボード全体を再描画する関数
            function renderScoreboard() {
                const playersToRender = playersConfig[mode];
                let gridColsClass = '';
                if (mode === '2p' || mode === 'team') {
                    gridColsClass = 'grid-cols-1 sm:grid-cols-2';
                } else if (mode === '3p') {
                    gridColsClass = 'grid-cols-1 sm:grid-cols-2 lg:grid-cols-3';
                }
                scoreboardContainer.className = `grid ${gridColsClass} gap-4 mb-8`;
                scoreboardContainer.innerHTML = '';

                playersToRender.forEach(player => {
                    const playerCard = createPlayerCard(player);
                    scoreboardContainer.appendChild(playerCard);
                    updateLogDisplay(player.id);
                });
            }

            // プレイヤーカードのHTML要素を作成する関数
            function createPlayerCard(player) {
                const playerDiv = document.createElement('div');
                playerDiv.className = `flex-1 flex flex-col items-center p-6 rounded-3xl shadow-lg ${player.color} transition-all duration-300`;

                const playerNameHeading = document.createElement('h2');
                playerNameHeading.className = 'text-2xl font-bold text-gray-800 mb-2 flex items-center';
                playerNameHeading.textContent = player.name;

                // チーム戦時のプレイヤー表示
                if (mode === 'team' && currentPlayers[player.id]) {
                    const currentPlayerSpan = document.createElement('span');
                    currentPlayerSpan.className = 'ml-2 text-xl font-bold p-2 rounded-lg';
                    currentPlayerSpan.textContent = `(${currentPlayers[player.id]})`;
                    // チームごとのプレイヤー表示スタイルを適用
                    if (currentPlayers[player.id] === 'P1') {
                        currentPlayerSpan.classList.add('bg-gray-200', 'text-red-500');
                    } else if (currentPlayers[player.id] === 'P2') {
                        currentPlayerSpan.classList.add('bg-gray-200', 'text-yellow-500');
                    } else if (currentPlayers[player.id] === 'P3') {
                        currentPlayerSpan.classList.add('bg-gray-200', 'text-blue-500');
                    }
                    playerNameHeading.appendChild(currentPlayerSpan);
                }

                const scoreSpan = document.createElement('span');
                scoreSpan.className = 'text-7xl md:text-9xl font-extrabold text-gray-900 leading-none mb-4';
                scoreSpan.textContent = scores[player.id];
                scoreSpan.id = `score-${player.id}`;

                const controlsDiv = document.createElement('div');
                controlsDiv.className = 'flex flex-col items-center space-y-2';

                const basicButtonsDiv = document.createElement('div');
                basicButtonsDiv.className = 'flex space-x-2';

                const incrementBtn = document.createElement('button');
                incrementBtn.className = 'w-12 h-12 bg-green-500 text-white text-2xl rounded-full shadow-md hover:bg-green-600 transition-all duration-200 transform hover:scale-110';
                incrementBtn.innerHTML = '⊕';
                incrementBtn.addEventListener('click', () => handleScoreChange(player.id, 1));
                basicButtonsDiv.appendChild(incrementBtn);

                const decrementBtn = document.createElement('button');
                decrementBtn.className = 'w-12 h-12 bg-red-500 text-white text-2xl rounded-full shadow-md hover:bg-red-600 transition-all duration-200 transform hover:scale-110';
                decrementBtn.innerHTML = '⊖';
                decrementBtn.addEventListener('click', () => handleDecrement(player.id));
                basicButtonsDiv.appendChild(decrementBtn);

                controlsDiv.appendChild(basicButtonsDiv);

                // チーム戦時のプレイヤー交代ボタン
                if (mode === 'team') {
                    const playerChangeButtonsDiv = document.createElement('div');
                    playerChangeButtonsDiv.className = 'flex justify-center space-x-2 mt-2';
                    const playerChangeConfig = [
                        { text: 'P1', player: 'P1', color: 'text-red-500' },
                        { text: 'P2', player: 'P2', color: 'text-yellow-500' },
                        { text: 'P3', player: 'P3', color: 'text-blue-500' },
                    ];
                    playerChangeConfig.forEach(config => {
                        const btn = document.createElement('button');
                        btn.className = `p-2 bg-gray-200 ${config.color} font-bold rounded-lg hover:bg-gray-300`;
                        btn.textContent = config.text;
                        btn.addEventListener('click', () => handlePlayerChange(player.id, config.player));
                        playerChangeButtonsDiv.appendChild(btn);
                    });
                    controlsDiv.appendChild(playerChangeButtonsDiv);
                }

                // 特定の追加ボタン
                const customButtonsDiv = document.createElement('div');
                customButtonsDiv.className = 'flex flex-wrap justify-center gap-2 mt-4';
                const customButtonsConfig = [
                    { text: 'Spin 1', value: 1, action: 'Spin', color: 'bg-yellow-400', hoverColor: 'hover:bg-yellow-500' },
                    { text: 'Over 2', value: 2, action: 'Over', color: 'bg-green-500', hoverColor: 'hover:bg-green-600' },
                    { text: 'Birth 2', value: 2, action: 'Birth', color: 'bg-red-500', hoverColor: 'hover:bg-red-600' },
                    { text: 'Xtreme 3', value: 3, action: 'Xtreme', color: 'bg-blue-500', hoverColor: 'hover:bg-blue-600' },
                ];
                customButtonsConfig.forEach(btnConfig => {
                    const btn = document.createElement('button');
                    btn.className = `p-2 ${btnConfig.color} text-white font-bold rounded-lg shadow-md ${btnConfig.hoverColor} transition-all duration-200 transform hover:scale-105`;
                    btn.textContent = btnConfig.text;
                    btn.addEventListener('click', () => handleScoreChange(player.id, btnConfig.value, btnConfig.action));
                    customButtonsDiv.appendChild(btn);
                });
                controlsDiv.appendChild(customButtonsDiv);

                // ログ表示
                const logContainer = document.createElement('div');
                logContainer.className = 'w-full mt-4 p-2 bg-white rounded-lg shadow-inner max-h-24 overflow-y-auto log-container';
                const logTitle = document.createElement('h3');
                logTitle.className = 'font-semibold text-gray-700 border-b pb-1 mb-1';
                logTitle.textContent = '得点ログ:';
                logContainer.appendChild(logTitle);
                const logList = document.createElement('ul');
                logList.className = 'text-sm text-gray-600';
                logList.id = `log-list-${player.id}`;
                logContainer.appendChild(logList);
                
                playerDiv.appendChild(playerNameHeading);
                playerDiv.appendChild(scoreSpan);
                playerDiv.appendChild(controlsDiv);
                playerDiv.appendChild(logContainer);

                return playerDiv;
            }

            // スコアの変更を処理する関数
            function handleScoreChange(player, delta, action = null) {
                scores[player] = Math.max(0, scores[player] + delta);
                updateScoreDisplay(player);

                const logEntry = { 
                    score: delta, 
                    action: action ? action : (delta > 0 ? '加算' : '減算'), 
                    playerName: currentPlayers[player] || null 
                };
                logs[player].push(logEntry);
                updateLogDisplay(player);
            }

            // スコアを1つ戻す関数
            function handleDecrement(player) {
                // デクリメントボタンは-1点として扱う
                const lastLog = { score: 1, action: '減算' };
                scores[player] = Math.max(0, scores[player] - lastLog.score);
                updateScoreDisplay(player);
                logs[player].push(lastLog);
                updateLogDisplay(player);
            }

            // 全ての操作を元に戻す関数
            function handleUndo() {
                const allLogs = Object.keys(logs).flatMap(player => 
                    logs[player].map((log, index) => ({
                        player: player,
                        log: log,
                        timestamp: index
                    }))
                );

                if (allLogs.length === 0) return;

                const lastMove = allLogs.reduce((prev, current) => {
                    return (prev.timestamp > current.timestamp) ? prev : current;
                });

                if (lastMove) {
                    const player = lastMove.player;
                    const scoreToUndo = lastMove.log.score;
                    scores[player] = Math.max(0, scores[player] - scoreToUndo);
                    logs[player].splice(lastMove.timestamp, 1);
                    updateScoreDisplay(player);
                    updateLogDisplay(player);
                }
            }
            
            // スコアをリセットする関数
            function handleResetScores() {
                scores = {
                    player1: 0,
                    player2: 0,
                    player3: 0,
                    team1: 0,
                    team2: 0,
                };
                logs = {
                    player1: [],
                    player2: [],
                    player3: [],
                    team1: [],
                    team2: [],
                };
                currentPlayers = {
                    team1: '',
                    team2: '',
                };
                renderScoreboard();
            }
            
            // チーム戦のプレイヤーを切り替える関数
            function handlePlayerChange(team, player) {
                currentPlayers[team] = player;
                scores['team1'] = 0;
                scores['team2'] = 0;
                renderScoreboard();
            }

            // スコアの表示を更新する関数
            function updateScoreDisplay(player) {
                const scoreSpan = document.getElementById(`score-${player}`);
                if (scoreSpan) {
                    scoreSpan.textContent = scores[player];
                }
            }

            // ログの表示を更新する関数
            function updateLogDisplay(player) {
                const logList = document.getElementById(`log-list-${player}`);
                if (logList) {
                    logList.innerHTML = '';
                    logs[player].forEach(log => {
                        const li = document.createElement('li');
                        li.textContent = `${log.playerName ? `${log.playerName}` : ''} ${log.action} (+${log.score})`;
                        logList.appendChild(li);
                    });
                }
            }
        });
    </script>
</body>
</html>
